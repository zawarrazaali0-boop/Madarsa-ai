<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Madaris AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #173f35;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #173f35;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #24594c;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .subject {
      background: white;
      padding: 20px 10px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      font-size: 17px;
    }

    .answer {
      background: white;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 Madaris AI</h1>
    <p>Shia Madaris Knowledge Assistant</p>
  </header>

  <div class="container">

    <div class="search-box">

      <textarea
        id="question"
        placeholder="Ask your question...&#10;&#10;مثلاً: عامل کی تعریف کیا ہے؟"
      ></textarea>

      <button onclick="askQuestion()">
        🤖 Ask Madaris AI
      </button>

    </div>

    <h2>📖 Subjects</h2>

    <div class="subjects">

      <div class="subject">📘 Awamil</div>
      <div class="subject">📗 Sarf</div>
      <div class="subject">📙 Nahw</div>
      <div class="subject">📕 Mantiq</div>
      <div class="subject">📔 Fiqh</div>
      <div class="subject">📓 Aqaaid</div>
      <div class="subject">📜 Hadith</div>
      <div class="subject">📚 Tafsir</div>

    </div>

    <div id="answer" class="answer"></div>

  </div>

  <footer>
    Madaris AI • Educational Project
  </footer>

  <script>

    function askQuestion() {

      const question =
        document.getElementById("question").value.trim();

      const answer =
        document.getElementById("answer");

      if (!question) {
        alert("Please enter a question.");
        return;
      }

      answer.style.display = "block";

      answer.innerHTML =
        "<h3>🤖 Madaris AI</h3>" +
        "<p>Your question has been received:</p>" +
        "<p><strong>" + question + "</strong></p>" +
        "<p>Gemini AI connection will be added in the next step.</p>";

    }

  </script>

</body>
  </html>
